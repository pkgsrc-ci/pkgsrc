#
# Rebase the trunk branch in this repository with upstream netbsd/pkgsrc.  Runs
# every hour using the schedule feature.
#
name: Rebase against NetBSD/pkgsrc
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase trunk against NetBSD/pkgsrc
        run: |
          git remote add netbsd https://github.com/netbsd/pkgsrc.git
          git fetch netbsd
          git config user.name "Jonathan Perkin"
          git config user.email jperkin@pkgsrc.org
          git rebase netbsd/trunk
          git push --force origin trunk
