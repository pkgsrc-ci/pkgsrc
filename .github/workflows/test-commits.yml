name: Test commits
on:
  push:
    branches:
      - trunk
      - 'ci/**'
  workflow_dispatch:
jobs:
  what-changed:
    runs-on: ubuntu-latest
    outputs:
      bootstrap-hash: ${{ steps.what-changed.outputs.bootstrap-hash }}
      pkgbuild-files: ${{ steps.what-changed.outputs.pkgbuild-files }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: pkgsrc-ci/what-changed@v1
        id: what-changed
      - name: Show debug information
        shell: bash
        run: |
          set | grep GITHUB_
          cat >w <<-EOF
          ${{ toJSON(steps.what-changed) }}
          EOF
          cat w
          cat >g <<-EOF
          ${{ toJSON(github.event) }}
          EOF
          cat g
  bootstrap:
    needs: what-changed
    uses: ./.github/workflows/bootstrap.yml
    with:
      bootstrap-hash: ${{ needs.what-changed.outputs.bootstrap-hash }}
